name: cyber-alerts

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 min (GitHub's minimum; runs can be delayed at busy times)
  workflow_dispatch:         # "Run workflow" button for manual tests
    inputs:
      preview:
        description: "Preview: send sample alerts (one per type) to see the format"
        type: boolean
        default: false

permissions:
  contents: write            # needed to save state/seen.json back to the repo

concurrency:
  group: cyber-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check feeds and send alerts
        env:
          WHATSAPP_PROVIDER:     ${{ secrets.WHATSAPP_PROVIDER }}
          WHATSAPP_TO:           ${{ secrets.WHATSAPP_TO }}
          META_TOKEN:            ${{ secrets.META_TOKEN }}
          META_PHONE_NUMBER_ID:  ${{ secrets.META_PHONE_NUMBER_ID }}
          META_TEMPLATE_NAME:    ${{ secrets.META_TEMPLATE_NAME }}
          META_TEMPLATE_LANG:    ${{ secrets.META_TEMPLATE_LANG }}
          META_MODE:             ${{ secrets.META_MODE }}
          TWILIO_ACCOUNT_SID:    ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN:     ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM:  ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_CONTENT_SID:    ${{ secrets.TWILIO_CONTENT_SID }}
          TEAMS_WEBHOOK_URL:     ${{ secrets.TEAMS_WEBHOOK_URL }}
          NVD_API_KEY:           ${{ secrets.NVD_API_KEY }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alert_bot.py ${{ inputs.preview && '--preview' || '' }}

      - name: Save state (so you never get the same alert twice)
        run: |
          git config user.name  "cyber-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "update alert state [skip ci]" && git push)
